services:
  - type: web
    name: fish-farm-os
    env: node
    buildCommand: npm install && npm run build
    startCommand: node server.mjs
    envVars:
      - key: VITE_GROQ_API_KEY
        sync: false
      - key: VITE_GEMINI_API_KEY
        sync: false
      - key: VITE_OPENROUTER_API_KEY
        sync: false
